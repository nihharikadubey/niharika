<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Google Cloud Arcade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eeff"/>
      <stop offset="0.5" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#eafaf1"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="1" stop-color="#fbbc05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a1b6b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="150" fill="#a142f4" opacity="0.08"/>
  <circle cx="700" cy="380" r="180" fill="#4285f4" opacity="0.08"/>
  <circle cx="660" cy="90" r="90" fill="#fbbc05" opacity="0.12"/>

  <!-- pixel confetti -->
  <g opacity="0.9">
    <rect x="150" y="70" width="12" height="12" rx="2" fill="#ea4335"/>
    <rect x="620" y="300" width="12" height="12" rx="2" fill="#34a853"/>
    <rect x="560" y="120" width="10" height="10" rx="2" fill="#a142f4"/>
    <rect x="210" y="340" width="10" height="10" rx="2" fill="#fbbc05"/>
    <rect x="690" y="180" width="10" height="10" rx="2" fill="#4285f4"/>
  </g>

  <!-- game controller -->
  <g transform="translate(300 250)" filter="url(#soft)">
    <rect x="-150" y="-62" width="300" height="130" rx="62" fill="url(#pad)"/>
    <!-- d-pad -->
    <g fill="#ffffff">
      <rect x="-104" y="-14" width="56" height="20" rx="5"/>
      <rect x="-86" y="-32" width="20" height="56" rx="5"/>
    </g>
    <!-- action buttons in google colors -->
    <circle cx="72" cy="-22" r="13" fill="#ea4335"/>
    <circle cx="108" cy="8" r="13" fill="#fbbc05"/>
    <circle cx="72" cy="38" r="13" fill="#34a853"/>
    <circle cx="36" cy="8" r="13" fill="#ffffff"/>
    <!-- center star button -->
    <circle cx="-8" cy="8" r="16" fill="#ffffff" opacity="0.25"/>
    <path d="M-8 -4 L-4 4 L4 5 L-2 11 L0 19 L-8 14 L-16 19 L-14 11 L-20 5 L-12 4 Z" fill="#ffffff"/>
  </g>

  <!-- trophy -->
  <g transform="translate(590 230)" filter="url(#soft)">
    <path d="M-44 -50 h88 v18 a44 44 0 0 1 -88 0 Z" fill="url(#trophy)"/>
    <path d="M-44 -46 h-22 a22 26 0 0 0 22 30 Z" fill="#f6b000"/>
    <path d="M44 -46 h22 a22 26 0 0 1 -22 30 Z" fill="#f6b000"/>
    <rect x="-10" y="6" width="20" height="26" fill="#e08f00"/>
    <rect x="-30" y="32" width="60" height="16" rx="6" fill="#e08f00"/>
    <path d="M0 -40 L5 -28 L18 -27 L8 -19 L11 -6 L0 -13 L-11 -6 L-8 -19 L-18 -27 L-5 -28 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- points chip -->
  <g transform="translate(600 330)" filter="url(#soft)">
    <rect x="-56" y="-22" width="112" height="44" rx="22" fill="#ffffff" stroke="#e5ecf6" stroke-width="2"/>
    <circle cx="-30" cy="0" r="13" fill="#fbbc05"/>
    <text x="-30" y="5" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#8a5a00" text-anchor="middle">★</text>
    <text x="18" y="6" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#1a73e8" text-anchor="middle">Arcade</text>
  </g>
</svg>
